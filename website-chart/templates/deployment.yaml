apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wlanboy-site.fullname" . }}
  labels:
    {{- include "wlanboy-site.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      {{- include "wlanboy-site.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wlanboy-site.selectorLabels" . | nindent 8 }}
        sidecar.istio.io/inject: "true"
    spec:
      # Der Pod braucht keinen Zugriff auf die Kubernetes-API
      automountServiceAccountToken: false
      # Gilt auch für das optionale PVC: Init-Container und nginx schreiben/lesen als Gruppe 101
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: site-content
              mountPath: {{ .Values.site.mountPath }}
              readOnly: true
            # nginx-unprivileged legt PID-Datei und Temp-Verzeichnisse unter /tmp ab
            - name: nginx-tmp
              mountPath: /tmp
          # nginx-unprivileged zeigt per Default auf /usr/share/nginx/html und lauscht auf 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      initContainers:
        - name: git-populate
          image: "{{ .Values.gitImage.repository }}:{{ .Values.gitImage.tag }}"
          imagePullPolicy: {{ .Values.gitImage.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.gitResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: HOME
              value: /tmp
            # Values kommen per Umgebungsvariable ins Skript, nicht als Text, damit die Shell sie nicht auswertet
            - name: SITE_REPO_URL
              value: {{ .Values.site.repoUrl | quote }}
            - name: SITE_REF
              value: {{ .Values.site.ref | default "" | quote }}
            - name: SITE_SUBPATH
              value: {{ .Values.site.subPath | default "" | quote }}
          command:
            - sh
            - -c
            - |
              set -eux
              rm -rf /content/* || true
              git clone --depth 1 -- "$SITE_REPO_URL" /content/repo
              if [ -n "$SITE_REF" ]; then
                git -C /content/repo checkout "$SITE_REF"
              fi
              # .git liegt im Repo-Root und wird von * nicht erfasst, es verschwindet mit /content/repo
              mv "/content/repo${SITE_SUBPATH:+/$SITE_SUBPATH}"/* /content/
              rm -rf /content/repo
          volumeMounts:
            - name: site-content
              mountPath: /content
            - name: git-tmp
              mountPath: /tmp
      volumes:
        - name: site-content
          {{- if .Values.pvc.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.name }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.contentSizeLimit }}
          {{- end }}
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: git-tmp
          emptyDir:
            sizeLimit: 16Mi
