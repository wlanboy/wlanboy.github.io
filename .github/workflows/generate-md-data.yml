name: Generate README Data

on:
  workflow_dispatch:
  schedule: 
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest

      - name: Run generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run generate.py

      - name: Commit changes if needed
        run: |
          if git diff --quiet -- readme-data.json; then
            echo "No changes to commit"
            exit 0
          fi

          # pushed_at ändert sich bei jedem Push (auch durch diesen Commit selbst)
          # und zählt daher nicht als echte Änderung.
          strip='del(.[].pushed_at)'
          if cmp -s <(git show HEAD:readme-data.json | jq "$strip") <(jq "$strip" readme-data.json); then
            echo "Only pushed_at changed, skipping commit"
            exit 0
          fi

          git config user.name "GitHub Action"
          git config user.email "actions@github.com"
          git add readme-data.json
          git commit -m "Update readme-data.json"
          git push
