apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wlanboy-site.fullname" . | default .Release.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        sidecar.istio.io/inject: "true"
    spec:
      # Gilt auch für das optionale PVC: Init-Container und nginx schreiben/lesen als Gruppe 101
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: site-content
              mountPath: {{ .Values.site.mountPath }}
              readOnly: true
            # nginx-unprivileged legt PID-Datei und Temp-Verzeichnisse unter /tmp ab
            - name: nginx-tmp
              mountPath: /tmp
          # nginx-unprivileged zeigt per Default auf /usr/share/nginx/html und lauscht auf 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      initContainers:
        - name: git-populate
          image: "{{ .Values.gitImage.repository }}:{{ .Values.gitImage.tag }}"
          imagePullPolicy: {{ .Values.gitImage.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.gitResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: HOME
              value: /tmp
          command:
            - sh
            - -c
            - |
              set -eux
              rm -rf /content/* || true
              git clone --depth 1 {{ .Values.site.repoUrl }} /content/repo
              cd /content/repo
              {{- if .Values.site.ref }}
              git checkout {{ .Values.site.ref }}
              {{- end }}
              {{- if .Values.site.subPath }}
              mkdir -p /content/site
              cp -r {{ .Values.site.subPath }}/* /content/site/
              rm -rf /content/repo
              mv /content/site/* /content/
              {{- else }}
              mv /content/repo/* /content/
              rm -rf /content/repo
              {{- end }}
          volumeMounts:
            - name: site-content
              mountPath: /content
            - name: git-tmp
              mountPath: /tmp
      volumes:
        - name: site-content
          {{- if .Values.pvc.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.name }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.contentSizeLimit }}
          {{- end }}
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: git-tmp
          emptyDir:
            sizeLimit: 16Mi
