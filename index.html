<div id="controls">
  <div id="search-wrapper">
    <input type="text" id="search" placeholder="Suche…">
  </div>
  <select id="repoFilter">
    <option value="">Alle Repos</option>
  </select>
  <button class="ctrl-btn" id="toggleTheme">🌙/☀️</button>
</div>

<div id="grid"></div>

<div id="modal" class="hidden">
  <div id="modalContent">
    <button id="modalClose">✕</button>
    <h2 id="modalTitle"></h2>
    <h4 id="modalRepo"></h4>
    <pre id="modalText"></pre>
    <a id="modalLink" href="#" target="_blank" rel="noopener noreferrer">Auf GitHub öffnen</a>
  </div>
</div>

<script src="script.js"></script>
<script>
  // Nur ein Menü gleichzeitig offen; Klick außerhalb schließt
  const groups = document.querySelectorAll("#site-nav details");
  groups.forEach(d => d.addEventListener("toggle", () => {
    if (d.open) groups.forEach(o => { if (o !== d) o.open = false; });
  }));
  document.addEventListener("click", e => {
    if (!e.target.closest("#site-nav")) groups.forEach(o => o.open = false);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") groups.forEach(o => o.open = false);
  });
</script>
</body>
</html>
