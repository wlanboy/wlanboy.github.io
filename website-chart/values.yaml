image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.30-trixie"
  pullPolicy: IfNotPresent

gitImage:
  repository: buildpack-deps
  tag: "trixie-scm"
  pullPolicy: IfNotPresent

replicaCount: 1

site:
  repoUrl: "https://github.com/wlanboy/wlanboy.github.io.git"
  ref: "main"
  subPath: ""
  mountPath: "/usr/share/nginx/html"

# Kein CPU-Limit, damit nginx bei Lastspitzen nicht gedrosselt wird
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

gitResources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
nodeSelector: {}
tolerations: []
affinity: {}

# Seiteninhalt: Der Init-Container klont das Repo bei jedem Pod-Start neu, daher reicht ein emptyDir.
contentSizeLimit: "32Mi"

# Optional statt emptyDir. Mit ReadWriteOnce bindet das PVC den Pod an einen Knoten,
# dann scheitern Rolling Updates auf anderen Knoten und replicaCount > 1.
pvc:
  enabled: false
  name: "wlanboy-site-pvc"
  accessModes:
    - ReadWriteOnce
  storageClassName: "" 
  size: "10Mi"

service:
  type: ClusterIP
  port: 80
  name: "wlanboy-site-svc"

istio:
  enabled: true
  gatewayNamespace: "istio-ingress"
  gatewayName: "wlanboy-gw"
  hosts: 
    - "wlanboy.tp.lan"
    - "wlanboy.gmk.lan"
  tls:
    enabled: true
    secretName: "wlanboy-tls"

certManager:
  enabled: true
  issuerRef:
    kind: "ClusterIssuer"
    name: "local-ca-issuer"
  dnsNames:
    - "wlanboy.tp.lan"
    - "wlanboy.gmk.lan"
